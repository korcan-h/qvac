# TEMP DIAGNOSTIC (debug/cuda-capture-ci, do not merge): the Windows finetune crash
# "MUL_MAT failed: CUDA error: out of memory" on CUDA graph capture.
#
# Findings so far: during capture of the training graph, cuBLAS allocates (cudaMallocAsync, i.e.
# a graph memory node) on every LoRA-A matmul ([2048|6144 x 8] x [.. x 128]); on the Windows GPU
# runners that cuMemAllocAsync fails with OUT_OF_MEMORY and ggml aborts.
#
# This workflow builds qvac-ggml-cuda.dll from fabric v11018.2.0 (the version in the published
# @qvac/fabric-win32-x64 0.22.0) plus one patch per variant, on a GitHub-hosted runner, then swaps
# it into the SDK install on qvac-win25-x64-gpu and runs tmp-cuda-capture-repro/repro.mjs.
#
# No secrets, read-only token, no Actions caches written, artifacts kept for 1 day.
name: TMP CUDA capture repro (do not merge)

on:
  push:
    branches: [debug/cuda-capture-ci]
    paths:
      - .github/workflows/tmp-cuda-capture-repro.yml
      - tmp-cuda-capture-repro/**

permissions:
  contents: read

jobs:
  build-module:
    name: build ${{ matrix.variant }}
    # windows-2022, not windows-2025: CUDA 13.0 needs a VS 2022 toolset (< 14.50), which the
    # GitHub-hosted windows-2025 image doesn't ship (the repo's own CUDA builds use the self-hosted
    # qvac-win25-x64, which we leave alone).
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # rebuilt: no patch (control, must still crash); the others: tmp-cuda-capture-repro/patches/<variant>.patch
        # outprod-fix removes out-prod.cu's cublasSetStream, which resets the cuBLAS workspace so cuBLAS
        # allocates during capture (upstream dropped it in d9b6be07d). Answered earlier: diag, fallback,
        # no-train-graphs.
        variant: [rebuilt, outprod-fix, outprod-fix-diag]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: tmp-cuda-capture-repro
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: tetherto/qvac-fabric-llm.cpp
          ref: v11018.2.0
          path: fabric
          persist-credentials: false

      - name: Apply the variant's patch
        if: matrix.variant != 'rebuilt'
        run: |
          git -C fabric apply --verbose "$env:GITHUB_WORKSPACE/tmp-cuda-capture-repro/patches/${{ matrix.variant }}.patch"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Same pinned CUDA 13.0.3 components as .github/actions/setup-cuda (nvcc 13.0.88, as the vcpkg
      # port). Downloaded here instead of using that action, because it saves the toolkit into the
      # repo's Actions cache on push events.
      - name: Fetch CUDA 13.0.3 (no cache)
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $cuda = Join-Path $env:RUNNER_TEMP 'cuda'
          $components = @(
            @('cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-13.0.88-archive.zip', '61760e24a44937c6c29a20ddea69067b4d3860ccd6a9a0564573f840d96e6c5f'),
            @('libnvvm/windows-x86_64/libnvvm-windows-x86_64-13.0.88-archive.zip', '6dda4a82d22a2c173a65c66b4b4c933e3424a56ce845e2864bdca9cc66e6c524'),
            @('cuda_crt/windows-x86_64/cuda_crt-windows-x86_64-13.0.88-archive.zip', 'ff413c89dbd96ed3b3dcfac923437de78acea32fb90309277197c8a127588112'),
            @('cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-13.0.96-archive.zip', 'a2ed875f9997aa24904fb70cc9db3acd9308433cde99bc8e63ec1271c9da31b4'),
            @('cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-13.0.85-archive.zip', 'f4f5187f7976d8057d76e1e04e72c8b7d0a2a22793107a671ad709b1d8d3408d'),
            @('libcublas/windows-x86_64/libcublas-windows-x86_64-13.1.1.3-archive.zip', 'd6dfb0f7ad09730bafa1fd948bc65472e28c8a6dc30b4a2b32191f2380f9282b')
          )
          New-Item -ItemType Directory -Force $cuda | Out-Null
          foreach ($c in $components) {
            $zip = Join-Path $env:RUNNER_TEMP (Split-Path $c[0] -Leaf)
            Invoke-WebRequest -UseBasicParsing -OutFile $zip "https://developer.download.nvidia.com/compute/cuda/redist/$($c[0])"
            if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $c[1].ToUpper()) { throw "sha256 mismatch: $($c[0])" }
            $tmp = Join-Path $env:RUNNER_TEMP 'cuda-extract'
            Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $tmp | Out-Null
            & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $tmp   # not Git's GNU tar, which reads C: as a host
            if ($LASTEXITCODE) { throw "tar failed: $($c[0])" }
            $root = Get-ChildItem $tmp -Directory | Select-Object -First 1
            Copy-Item -Recurse -Force (Join-Path $root.FullName '*') $cuda
            Remove-Item -Recurse -Force $tmp, $zip
          }
          & (Join-Path $cuda 'bin\nvcc.exe') --version

      - name: Build qvac-ggml-cuda.dll (sm_89)
        run: |
          # A VS 2022 (14.4x) toolset, as setup-cuda selects: CUDA 13.0 rejects 14.50+.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          & $vswhere -all -products * -format json | ConvertFrom-Json |
            ForEach-Object { "found: $($_.displayName) $($_.installationVersion) at $($_.installationPath)" }
          $vs = & $vswhere -all -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vs) { throw 'no Visual Studio 2022 with the C++ x64 tools found' }
          $toolset = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Directory |
            Where-Object { $_.Name -match '^14\.(\d+)\.' -and [int]$Matches[1] -lt 50 } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $toolset) { throw 'no MSVC 14.x (< 14.50) toolset found' }
          $ver = ([version]$toolset.Name)
          "Visual Studio: $vs, MSVC toolset $($toolset.Name)"
          cmd /s /c "`"$(Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat')`" -vcvars_ver=$($ver.Major).$($ver.Minor) >nul && set" |
            ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { Set-Item -Path "env:$($Matches[1])" -Value $Matches[2] } }

          $cuda = Join-Path $env:RUNNER_TEMP 'cuda'
          $env:CUDA_PATH = $cuda
          $env:PATH = "$cuda\bin;$env:PATH"
          # The port's CUDA options, built for sm_89 only. Static CRT: the published DLL imports no C runtime.
          cmake -S fabric -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DBUILD_SHARED_LIBS=OFF -DGGML_BACKEND_DL=ON -DGGML_NATIVE=OFF -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_OPENMP=OFF -DGGML_VULKAN=OFF `
            -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=89-real "-DCMAKE_CUDA_COMPILER=$cuda\bin\nvcc.exe" `
            "-DCUDAToolkit_ROOT=$cuda" -DGGML_CUDA_GRAPHS=ON -DGGML_CUDA_FA=ON `
            "-DGGML_CUDA_FA_QUANTS=q4_0-q4_0;q8_0-q8_0;f16-f16;bf16-bf16" `
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_CURL=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --target ggml-cuda
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dll = Get-ChildItem build -Recurse -Filter 'qvac-ggml-cuda.dll' | Select-Object -First 1
          if (-not $dll) { throw 'qvac-ggml-cuda.dll not found' }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $dll.FullName out\
          dumpbin /dependents out\qvac-ggml-cuda.dll | Select-String '\.dll'
          (Get-FileHash out\qvac-ggml-cuda.dll -Algorithm SHA256).Hash

          # The standalone capture test (no ggml), built once.
          if ('${{ matrix.variant }}' -eq 'rebuilt') {
            nvcc -O2 -std=c++17 -arch=sm_89 -o out\capture_repro.exe tmp-cuda-capture-repro\capture_repro.cu "-L$cuda\lib\x64" -lcublas -lcuda
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: qvac-ggml-cuda-${{ matrix.variant }}
          path: out/qvac-ggml-cuda.dll
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        if: matrix.variant == 'rebuilt'
        with:
          name: capture-repro
          path: out/capture_repro.exe
          retention-days: 1
          if-no-files-found: error

  # Standalone: do graph memory allocations fail on these machines without ggml? Plus the machine setup.
  standalone:
    name: standalone ${{ matrix.leg }}
    needs: build-module
    if: ${{ !cancelled() }}
    runs-on: qvac-win25-x64-gpu
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Two legs, so both machines in the pool are likely covered.
        leg: [1, 2]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: capture-repro
          path: ${{ runner.temp }}\capture-repro

      - name: Machine setup
        continue-on-error: true
        run: |
          "machine: $env:COMPUTERNAME  runner: $env:RUNNER_NAME"
          $os = Get-CimInstance Win32_OperatingSystem
          "OS: $($os.Caption) $($os.Version) build $($os.BuildNumber)"
          "RAM: {0:N1} GiB total, {1:N1} GiB free" -f ($os.TotalVisibleMemorySize / 1MB), ($os.FreePhysicalMemory / 1MB)
          "commit limit: {0:N1} GiB, available {1:N1} GiB" -f ($os.TotalVirtualMemorySize / 1MB), ($os.FreeVirtualMemory / 1MB)
          Get-CimInstance Win32_PageFileUsage | ForEach-Object { "page file: $($_.Name), allocated $($_.AllocatedBaseSize) MiB, in use $($_.CurrentUsage) MiB" }
          "page file managed automatically: " + (Get-CimInstance Win32_ComputerSystem).AutomaticManagedPagefile
          $hags = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers' -Name HwSchMode -ErrorAction SilentlyContinue).HwSchMode
          "HwSchMode (hardware GPU scheduling: 2 = on, 1 = off, empty = default): $hags"
          Get-CimInstance Win32_VideoController | ForEach-Object { "display adapter: $($_.Name), driver $($_.DriverVersion)" }
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like 'NVIDIA*' } | ForEach-Object { "installed: $($_.DisplayName) $($_.DisplayVersion)" }
          nvidia-smi --query-gpu=name,driver_version,driver_model.current,driver_model.pending,memory.used,memory.total,compute_mode --format=csv
          nvidia-smi -q | Select-String -Pattern 'Product Name|Product Brand|Product Architecture|Driver Version|CUDA Version|Virtualization Mode'
          # Only a count, not the processes: other jobs share this GPU.
          "GPU compute processes right now: " + @(nvidia-smi --query-compute-apps=pid --format=csv,noheader | Where-Object { $_ }).Count
          "CUDA_PATH=$env:CUDA_PATH"
          $global:LASTEXITCODE = 0

      - name: Run the standalone capture test
        run: |
          $env:CUDA_LOG_FILE = Join-Path $env:RUNNER_TEMP 'cuda-driver.log'
          & (Join-Path $env:RUNNER_TEMP 'capture-repro\capture_repro.exe')
          $code = $LASTEXITCODE
          if (Test-Path $env:CUDA_LOG_FILE) { '--- CUDA driver error log ---'; Get-Content $env:CUDA_LOG_FILE -TotalCount 60 }
          else { '--- no CUDA driver error log was written ---' }
          Remove-Item -Force $env:CUDA_LOG_FILE -ErrorAction SilentlyContinue
          exit $code

  repro:
    name: test ${{ matrix.variant }}
    needs: build-module
    # Test the variants that did build even if another build failed (a missing artifact fails only that leg).
    if: ${{ !cancelled() }}
    runs-on: qvac-win25-x64-gpu
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # At most two jobs on the shared GPU machines at a time.
      max-parallel: 2
      matrix:
        variant: [rebuilt, outprod-fix, outprod-fix-diag]
    defaults:
      run:
        shell: powershell
        working-directory: tmp-cuda-capture-repro
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: tmp-cuda-capture-repro
          persist-credentials: false

      # First, so a variant whose build failed stops here in seconds, before npm install.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: qvac-ggml-cuda-${{ matrix.variant }}
          path: ${{ runner.temp }}\module

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 22

      - name: Install the SDK prebuilts
        env:
          # Keep npm's cache in the job's temp dir instead of the runner account's profile.
          npm_config_cache: ${{ runner.temp }}\npm-cache
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ls @qvac/sdk @qvac/llm-llamacpp @qvac/fabric
          $global:LASTEXITCODE = 0

      - name: Swap in the built qvac-ggml-cuda.dll
        run: |
          $target = 'node_modules\@qvac\fabric-win32-x64\prebuilds\win32-x64\qvac__fabric-win32-x64\qvac-ggml-cuda.dll'
          if (-not (Test-Path $target)) { throw "not found: $target" }
          "prebuilt: " + (Get-FileHash $target -Algorithm SHA256).Hash
          Copy-Item -Force (Join-Path $env:RUNNER_TEMP 'module\qvac-ggml-cuda.dll') $target
          "swapped:  " + (Get-FileHash $target -Algorithm SHA256).Hash + "  (${{ matrix.variant }})"

      - name: Runner info
        continue-on-error: true
        run: |
          "machine: $env:COMPUTERNAME  runner: $env:RUNNER_NAME"
          # Only the queried fields: plain nvidia-smi would also list other jobs' GPU processes in a public log.
          nvidia-smi --query-gpu=name,driver_version,driver_model.current,memory.used,memory.total --format=csv
          $global:LASTEXITCODE = 0

      - name: Run the finetune repro
        run: |
          # Everything the SDK and the worker write (model cache, ~/.qvac registry store, temp files)
          # goes under RUNNER_TEMP, which the runner empties after the job.
          $home_ = Join-Path $env:RUNNER_TEMP 'home'
          $tmp = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force $home_, $tmp | Out-Null
          $env:USERPROFILE = $home_; $env:HOME = $home_
          $env:TEMP = $tmp; $env:TMP = $tmp
          # Debug native logs show the graph warmup lines and the [diag] lines.
          @{ loggerLevel = 'debug'; loggerConsoleOutput = $true; cacheDirectory = (Join-Path $env:RUNNER_TEMP 'qvac-cache') } |
            ConvertTo-Json | Set-Content -Encoding ascii qvac.config.json
          # The driver writes a plain-English reason for each failed CUDA API call here.
          $env:CUDA_LOG_FILE = Join-Path $env:RUNNER_TEMP 'cuda-driver.log'
          & (Get-Command node).Source repro.mjs registry 20
          $code = $LASTEXITCODE
          if (Test-Path $env:CUDA_LOG_FILE) {
            '--- CUDA driver error log (first 60 lines) ---'
            Get-Content $env:CUDA_LOG_FILE -TotalCount 60
          } else {
            '--- no CUDA driver error log was written ---'
          }
          exit $code

      # The runner also empties RUNNER_TEMP after the job; this covers the workspace and makes the
      # cleanup visible in the log.
      - name: Clean up
        if: always()
        continue-on-error: true
        run: |
          foreach ($dir in 'node_modules', (Join-Path $env:RUNNER_TEMP 'qvac-cache'), (Join-Path $env:RUNNER_TEMP 'home'),
                           (Join-Path $env:RUNNER_TEMP 'tmp'), (Join-Path $env:RUNNER_TEMP 'npm-cache'),
                           (Join-Path $env:RUNNER_TEMP 'module')) {
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir -ErrorAction Continue; "removed $dir" }
          }
          Remove-Item -Force (Join-Path $env:RUNNER_TEMP '*.log') -ErrorAction SilentlyContinue
